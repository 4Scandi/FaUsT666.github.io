<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaUsT</title>
    <meta name="description" content="FaUsT — digital ghost | reverse engineer | void walker" />
    <meta name="theme-color" content="#020308" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #020308;
        --bg-alt: #050611;
        --cyan: #00f0ff;
        --cyan-soft: #1aa3ff;
        --red: #ff003c;
        --red-soft: #b3123b;
        --text-main: #f4f7ff;
        --text-sub: #8c9ab8;
        --border-strong: rgba(0, 240, 255, 0.7);
        --border-soft: rgba(0, 240, 255, 0.25);
        --shadow-strong: 0 0 32px rgba(0, 240, 255, 0.5);
        --shadow-red: 0 0 36px rgba(255, 0, 60, 0.7);
        --scanlines: rgba(255, 255, 255, 0.03);
        --noise: rgba(255, 255, 255, 0.035);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      .page {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% -10%, rgba(0, 240, 255, 0.18), transparent 55%),
          radial-gradient(circle at 80% 110%, rgba(255, 0, 60, 0.2), transparent 50%),
          radial-gradient(circle at 50% 50%, #020308, #000000 70%);
        isolation: isolate;
      }

      .page::before {
        content: "";
        position: fixed;
        inset: -2px;
        pointer-events: none;
        background-image: repeating-linear-gradient(
            to bottom,
            var(--scanlines) 0,
            var(--scanlines) 1px,
            transparent 1px,
            transparent 3px
          ),
          repeating-linear-gradient(
            to right,
            rgba(255, 255, 255, 0.02) 0,
            rgba(255, 255, 255, 0.02) 1px,
            transparent 1px,
            transparent 4px
          );
        mix-blend-mode: soft-light;
        opacity: 0.35;
        z-index: -1;
      }

      .page::after {
        content: "";
        position: fixed;
        inset: -50px;
        pointer-events: none;
        background-image: radial-gradient(circle at 0 0, var(--noise) 0, transparent 55%),
          radial-gradient(circle at 100% 0, var(--noise) 0, transparent 55%),
          radial-gradient(circle at 0 100%, var(--noise) 0, transparent 55%),
          radial-gradient(circle at 100% 100%, var(--noise) 0, transparent 55%);
        mix-blend-mode: soft-light;
        opacity: 0.6;
        animation: noiseShift 8s infinite alternate ease-in-out;
        z-index: -1;
      }

      .frame {
        position: relative;
        max-width: 620px;
        width: 100%;
        padding: clamp(28px, 4vw, 40px);
        border-radius: 16px;
        background: radial-gradient(circle at 20% 0, rgba(0, 240, 255, 0.08), transparent 55%),
          radial-gradient(circle at 80% 100%, rgba(255, 0, 60, 0.1), transparent 55%),
          linear-gradient(135deg, rgba(4, 10, 22, 0.92), rgba(3, 4, 10, 0.98));
        border: 1px solid rgba(255, 255, 255, 0.04);
        box-shadow:
          0 0 0 1px rgba(0, 240, 255, 0.15),
          0 28px 80px rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        overflow: hidden;
      }

      .frame::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-image: linear-gradient(135deg, var(--cyan), rgba(255, 255, 255, 0.05), var(--red-soft)) 1;
        opacity: 0.7;
        pointer-events: none;
      }

      .frame::after {
        content: "";
        position: absolute;
        inset: -30%;
        background:
          radial-gradient(circle at 0 0, rgba(0, 240, 255, 0.22), transparent 60%),
          radial-gradient(circle at 100% 100%, rgba(255, 0, 60, 0.25), transparent 65%);
        opacity: 0.35;
        mix-blend-mode: screen;
        filter: blur(26px);
        pointer-events: none;
        z-index: -1;
      }

      .accent-line {
        position: absolute;
        inset-inline: 14%;
        top: 18px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0,
          rgba(0, 240, 255, 0.1) 15%,
          rgba(0, 240, 255, 0.7) 40%,
          rgba(255, 0, 60, 0.8) 60%,
          rgba(255, 0, 60, 0.12) 80%,
          transparent 100%
        );
        opacity: 0.8;
        filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.8));
      }

      .nick {
        position: relative;
        font-family: "Anton", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(3.4rem, 6vw, 4.4rem);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-align: center;
        line-height: 1.05;
        text-shadow:
          0 0 18px rgba(0, 240, 255, 0.85),
          0 0 52px rgba(0, 0, 0, 0.9);
        filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.75));
        margin-top: 6px;
      }

      .nick span {
        display: inline-block;
      }

      .nick .glitch {
        position: relative;
        display: inline-block;
        padding-inline: 0.08em;
      }

      .nick .glitch::before,
      .nick .glitch::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0;
      }

      .nick .glitch::before {
        color: var(--cyan-soft);
        text-shadow:
          -2px 0 0 rgba(0, 240, 255, 0.9),
          0 0 12px rgba(0, 240, 255, 0.9);
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 55%);
      }

      .nick .glitch::after {
        color: var(--red);
        text-shadow:
          2px 0 0 rgba(255, 0, 60, 0.9),
          0 0 12px rgba(255, 0, 60, 0.8);
        clip-path: polygon(0 55%, 100% 45%, 100% 100%, 0 100%);
      }

      .nick.is-glitching .glitch::before,
      .nick.is-glitching .glitch::after {
        animation: glitchShift 220ms steps(2, end) infinite;
      }

      .nick.is-glitching .glitch::before {
        opacity: 1;
        animation-delay: -40ms;
      }

      .nick.is-glitching .glitch::after {
        opacity: 1;
        animation-delay: -120ms;
      }

      .subtitle {
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 0.82rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--text-sub);
        opacity: 0.9;
        text-align: center;
        margin-top: 6px;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      }

      .divider {
        width: 100%;
        margin: 12px 0 6px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .divider-line {
        flex: 1;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0,
          rgba(0, 240, 255, 0.4) 25%,
          rgba(0, 240, 255, 0.05) 50%,
          rgba(255, 0, 60, 0.4) 75%,
          transparent 100%
        );
        opacity: 0.8;
      }

      .divider-node {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow:
          0 0 0 1px rgba(0, 240, 255, 0.8),
          0 0 16px rgba(0, 240, 255, 0.9);
        background: radial-gradient(circle at 50% 30%, var(--cyan), transparent 70%);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 4px;
        justify-content: center;
      }

      .link-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 180px;
        padding: 12px 20px;
        border-radius: 999px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 0.68rem;
        overflow: hidden;
        border: 1px solid var(--border-soft);
        background:
          radial-gradient(circle at 0 0, rgba(0, 240, 255, 0.1), transparent 55%),
          radial-gradient(circle at 100% 100%, rgba(255, 0, 60, 0.08), transparent 55%),
          linear-gradient(135deg, rgba(1, 5, 12, 0.96), rgba(4, 6, 18, 0.98));
        color: var(--text-main);
        box-shadow:
          0 0 0 1px rgba(0, 240, 255, 0.16),
          0 16px 40px rgba(0, 0, 0, 0.9);
        transition:
          border-color 170ms ease-out,
          box-shadow 170ms ease-out,
          transform 150ms ease-out,
          background 170ms ease-out,
          color 170ms ease-out;
      }

      .link-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(0, 240, 255, 0.28), rgba(255, 0, 60, 0.35));
        opacity: 0;
        mix-blend-mode: screen;
        transition: opacity 180ms ease-out;
        pointer-events: none;
      }

      .link-btn span {
        position: relative;
        z-index: 1;
      }

      .link-btn svg {
        position: relative;
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        z-index: 1;
      }

      .link-btn--steam {
        border-color: rgba(0, 240, 255, 0.7);
        box-shadow: var(--shadow-strong);
      }

      .link-btn--discord {
        border-color: rgba(255, 0, 60, 0.4);
      }

      .link-btn--steam:hover,
      .link-btn--steam:focus-visible {
        outline: none;
        border-color: var(--border-strong);
        box-shadow:
          var(--shadow-strong),
          0 0 0 1px rgba(0, 240, 255, 0.8);
        transform: translateY(-1px);
      }

      .link-btn--discord:hover,
      .link-btn--discord:focus-visible {
        outline: none;
        border-color: rgba(255, 0, 60, 0.9);
        box-shadow:
          var(--shadow-red),
          0 0 0 1px rgba(255, 0, 60, 0.7);
        transform: translateY(-1px);
      }

      .link-btn--discord:hover::before,
      .link-btn--discord:focus-visible::before {
        opacity: 0.35;
      }

      .link-label-main {
        text-shadow:
          0 0 10px rgba(0, 240, 255, 0.8),
          0 0 26px rgba(0, 0, 0, 1);
      }

      .link-label-sub {
        opacity: 0.78;
        font-size: 0.64rem;
        letter-spacing: 0.12em;
      }

      .link-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

      .metrics {
        position: absolute;
        inset-inline: 20px;
        bottom: 16px;
        display: flex;
        justify-content: space-between;
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 0.58rem;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        color: rgba(140, 154, 184, 0.72);
        opacity: 0.7;
        pointer-events: none;
      }

      .metrics div {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .metrics-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
      }

      .metrics-dot--cyan {
        background: radial-gradient(circle at 30% 20%, var(--cyan), transparent 70%);
        box-shadow:
          0 0 0 1px rgba(0, 240, 255, 0.7),
          0 0 14px rgba(0, 240, 255, 0.9);
      }

      .metrics-dot--red {
        background: radial-gradient(circle at 30% 20%, var(--red), transparent 70%);
        box-shadow:
          0 0 0 1px rgba(255, 0, 60, 0.7),
          0 0 14px rgba(255, 0, 60, 0.9);
      }

      @keyframes glitchShift {
        0% {
          transform: translate(0, 0) skew(0deg);
        }
        20% {
          transform: translate(-2px, -1px) skew(-0.5deg);
        }
        40% {
          transform: translate(2px, 1px) skew(0.8deg);
        }
        60% {
          transform: translate(-1px, 1px) skew(-0.2deg);
        }
        80% {
          transform: translate(1px, -1px) skew(0.3deg);
        }
        100% {
          transform: translate(0, 0) skew(0);
        }
      }

      @keyframes noiseShift {
        0% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(-10px, 8px, 0);
        }
        100% {
          transform: translate3d(6px, -12px, 0);
        }
      }

      @media (max-width: 600px) {
        .frame {
          padding: 22px 18px 32px;
          border-radius: 14px;
        }

        .accent-line {
          inset-inline: 18%;
        }

        .metrics {
          inset-inline: 16px;
          bottom: 14px;
          font-size: 0.5rem;
          letter-spacing: 0.18em;
        }

        .links {
          gap: 10px;
        }

        .link-btn {
          min-width: 100%;
          padding-block: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="frame" aria-label="FaUsT digital card">
        <div class="accent-line" aria-hidden="true"></div>

        <h1 class="nick" aria-label="FaUsT">
          <span class="glitch" data-text="FaUsT">FaUsT</span>
        </h1>

        <p class="subtitle">digital ghost | reverse engineer | void walker</p>

        <div class="divider" aria-hidden="true">
          <div class="divider-line"></div>
          <div class="divider-node"></div>
          <div class="divider-line"></div>
        </div>

        <div class="links">
          <a
            class="link-btn link-btn--steam"
            href="https://steamcommunity.com/id/FFaUsTF/"
            target="_blank"
            rel="noreferrer"
          >
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs>
                <linearGradient id="steamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00f0ff" />
                  <stop offset="100%" stop-color="#1aa3ff" />
                </linearGradient>
              </defs>
              <circle cx="24" cy="24" r="22" fill="none" stroke="url(#steamCyan)" stroke-width="1.6" />
              <circle cx="20" cy="26" r="6.6" fill="none" stroke="#00f0ff" stroke-width="1.8" />
              <circle cx="20" cy="26" r="2.2" fill="#00f0ff" />
              <circle cx="32" cy="17" r="5.4" fill="none" stroke="#00f0ff" stroke-width="1.6" />
              <circle cx="32" cy="17" r="2.1" fill="#00f0ff" />
              <path
                d="M20.8 23.2L28 18.4"
                fill="none"
                stroke="#00f0ff"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M16.2 25.4L13 24.2"
                fill="none"
                stroke="#00f0ff"
                stroke-width="1.6"
                stroke-linecap="round"
                opacity="0.9"
              />
            </svg>
            <span class="link-text">
              <span class="link-label-main">Steam</span>
              <span class="link-label-sub">/id/FFaUsTF</span>
            </span>
          </a>

          <a
            class="link-btn link-btn--discord"
            href="https://discord.com/users/"
            target="_blank"
            rel="noreferrer"
          >
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs>
                <linearGradient id="discordRed" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff003c" />
                  <stop offset="100%" stop-color="#b3123b" />
                </linearGradient>
              </defs>
              <rect
                x="6"
                y="9"
                width="36"
                height="28"
                rx="11"
                ry="11"
                fill="none"
                stroke="url(#discordRed)"
                stroke-width="1.7"
              />
              <path
                d="M17 29c2.3 1.1 4.9 1.7 7 1.7 2.1 0 4.6-.6 7-1.7"
                fill="none"
                stroke="#ff003c"
                stroke-width="1.6"
                stroke-linecap="round"
              />
              <circle cx="19" cy="23" r="2.1" fill="#ff003c" />
              <circle cx="29" cy="23" r="2.1" fill="#ff003c" />
              <path
                d="M18 16l2.2 1.1M30 16l-2.2 1.1"
                fill="none"
                stroke="#ff003c"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
            <span class="link-text">
              <span class="link-label-main">Discord</span>
              <span class="link-label-sub">faust0986</span>
            </span>
          </a>
        </div>

        <div class="metrics" aria-hidden="true">
          <div>
            <span class="metrics-dot metrics-dot--cyan"></span>
            <span>online / untraceable</span>
          </div>
          <div>
            <span class="metrics-dot metrics-dot--red"></span>
            <span>signal / encrypted</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        const title = document.querySelector(".nick");
        if (!title) return;

        let timeoutId;

        function triggerGlitch() {
          const intensity = Math.random();
          if (intensity < 0.45) {
            const duration = 110 + Math.random() * 260;
            title.classList.add("is-glitching");
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
              title.classList.remove("is-glitching");
            }, duration);
          }
        }

        setInterval(triggerGlitch, 1500 + Math.random() * 1500);

        title.addEventListener("mouseenter", () => {
          title.classList.add("is-glitching");
        });
        title.addEventListener("mouseleave", () => {
          title.classList.remove("is-glitching");
        });
      })();
    </script>
  </body>
  </html>
